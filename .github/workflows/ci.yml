name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Tauri's Linux prerequisites.
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      # The desktop crate embeds `apps/desktop/dist` at compile time, so the
      # frontend is built before anything cargo does — including `cargo fmt`,
      # which is cheap to run last but not worth a separate ordering rule.
      - name: Build the desktop frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-run
      # `tauri` links Windows' WebView2 loader even where the tests use its
      # mock runtime, and `webview2-com-sys` unpacks `WebView2Loader.dll` for
      # every architecture under its build output (`out\arm64`, `out\x64`,
      # `out\x86`). A test executable runs from `target\debug\deps`, which is
      # the directory Windows searches first, so without a copy there the
      # loader binds to the system-wide DLL, whose exports do not match, and
      # the test exits 0xc0000139 before running a line. The copy has to be
      # the runner's own architecture: the arm64 DLL beside an x64 binary
      # fails the same way. The listing is deliberate: if the DLL ever moves,
      # the log says where it went.
      - name: Put the WebView2 loader beside the test binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = switch ($env:PROCESSOR_ARCHITECTURE) {
            "ARM64" { "arm64" }
            "x86" { "x86" }
            default { "x64" }
          }
          $found = Get-ChildItem -Path target -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue
          $found | ForEach-Object { Write-Host "found: $($_.FullName)" }
          $right = $found | Where-Object { $_.Directory.Name -eq $arch } | Select-Object -First 1
          if ($right) {
            Copy-Item -Path $right.FullName -Destination target\debug\deps\ -Force
            Write-Host "copied the $arch loader to target\debug\deps"
          } elseif ($found) {
            Copy-Item -Path $found[0].FullName -Destination target\debug\deps\ -Force
            Write-Host "no $arch loader found; copied $($found[0].FullName) to target\debug\deps"
          } else {
            Write-Host "no WebView2Loader.dll anywhere under target"
          }
      - run: cargo test --workspace
      # When a Windows test binary exits 0xc0000139 before running a line,
      # the OS does not say which import it could not resolve. This asks the
      # loader the same question one import at a time and prints the answer.
      - name: Say which import the Windows test binaries cannot resolve
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python .github/scripts/unresolved_imports.py target\debug\deps
          # The loader's own words, if a hard-error popup was logged.
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Application Popup'; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Message
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error'; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Message
