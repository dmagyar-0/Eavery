[workspace]
resolver = "2"
members = [
  "crates/eavery-core",
  "crates/eavery-acp",
  "crates/eavery-engines",
  "crates/eavery-docs-mcp",
  "crates/eavery-fake-agent",
  "crates/eavery-cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/dmagyar-0/eavery"

[workspace.dependencies]
eavery-core = { path = "crates/eavery-core" }
eavery-acp = { path = "crates/eavery-acp" }
eavery-engines = { path = "crates/eavery-engines" }

tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
agent-client-protocol = "2.0.0"
# Pinned to what `agent-client-protocol` 2.0.0 requires (`=1.5.0`), so the two
# can co-resolve. Neither is used yet: M0-T06 took the hand-rolled §7 client.
agent-client-protocol-schema = "=1.5.0"
rmcp = { version = "3.2.0", features = ["server", "transport-io", "macros"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0.0"
dunce = "1.0.5"
async-trait = "0.1.92"
futures = "0.3.34"
tempfile = "3.27.0"
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl", "chrono-impl"] }
keyring = "4.2.0"
tauri = { version = "2.9.3", features = [] }
tauri-build = { version = "2.5.1", features = [] }
tauri-plugin-opener = "2.5.2"
tauri-plugin-dialog = "2.7.3"
# Not used by discovery, which resolves against a `Platform` parameter so the
# Windows rules can be tested from any OS (M1-T01, `CHANGELOG-plan.md`). Kept
# for anything that only ever needs to look something up on the host.
which = "8.0.6"
serde_yaml = "0.9.34"
zip = "8.6.0"
quick-xml = "0.42.0"
calamine = "0.36.1"
umya-spreadsheet = "3.1.0"
rust_xlsxwriter = "0.99.0"
docx-rs = "0.4.22"
pdf-extract = "0.12.0"
lopdf = "0.44.0"

# Tauri's size guidance (https://tauri.app/concept/size/). A profile in a
# workspace member is ignored, so it lives here, and `panic = "abort"` is left
# out of it deliberately: it is the one setting of the five that would stop
# `cargo test --release` compiling at all.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
